name: Refresh Vest documentation updates
on:
  workflow_dispatch:
  schedule:
    - cron: '19 10 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/vest-updates.yml'
      - 'scripts/refresh-vest-updates.mjs'
permissions:
  contents: write
concurrency:
  group: vest-docs-daily
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compare published Vest docs with last snapshot
        run: node scripts/refresh-vest-updates.mjs
      - name: Publish changed feed (triggers Pages deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/vest-updates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Vest updates and documentation revisions"
          git pull --rebase origin main
          git push origin HEAD:main
