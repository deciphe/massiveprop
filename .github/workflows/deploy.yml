name: Deploy MASSIVE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install MASSIVE dependencies
        run: npm ci


      - name: Bundle complete payout archive fallback
        run: |
          git fetch --depth=1 origin vestflow-data
          mkdir -p /tmp/massive-data
          git archive FETCH_HEAD | tar -x -C /tmp/massive-data
          cp /tmp/massive-data/*.json public/data/
          cp -R /tmp/massive-data/weekly /tmp/massive-data/seasons public/data/

      - name: Build MASSIVE
        run: npm run build

      - name: Check page render and execution calculations
        run: |
          node scripts/test-web3.mjs
          node scripts/test-flows.mjs
          node scripts/test-weekly.mjs
          node scripts/test-seasons.mjs
          node scripts/test-trader-wallets.mjs
          node scripts/test-refresh.mjs
          node scripts/test-assets.mjs



      # A failed Flat MASSIVE contract or responsive browser test blocks deployment.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          (npx vite preview --host 127.0.0.1 > /tmp/massive-preview.log 2>&1 &)
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/massive-preview.log
          exit 1

      - name: Responsive QA / 66 viewport checks
        run: node scripts/audit-responsive.mjs

      - name: Flat MASSIVE design / visual and interaction QA
        run: node scripts/audit-design.mjs

      - name: Preserve QA reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: massive-release-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/responsive/
            artifacts/design/
          if-no-files-found: ignore
          retention-days: 21

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
